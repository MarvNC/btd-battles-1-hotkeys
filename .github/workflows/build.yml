name: Build AHK v2

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (AHK v2, x64+x86)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify AutoHotkey v2 executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Join-Path $env:RUNNER_TEMP 'ahk-build'
          New-Item -ItemType Directory -Path "$tools/runtime", "$tools/compiler", 'dist' -Force | Out-Null
          gh release download v2.0.18 --repo AutoHotkey/AutoHotkey --pattern '*.zip' --dir "$tools/runtime"
          if ($LASTEXITCODE -ne 0) { throw 'AutoHotkey download failed' }
          gh release download --repo AutoHotkey/Ahk2Exe --pattern '*.zip' --dir "$tools/compiler"
          if ($LASTEXITCODE -ne 0) { throw 'Ahk2Exe download failed' }
          Get-ChildItem "$tools/runtime/*.zip" | ForEach-Object { Expand-Archive $_.FullName "$tools/runtime" -Force }
          Get-ChildItem "$tools/compiler/*.zip" | ForEach-Object { Expand-Archive $_.FullName "$tools/compiler" -Force }
          $compiler = (Get-ChildItem "$tools/compiler" -Filter Ahk2Exe.exe -Recurse | Select-Object -First 1).FullName
          if (!$compiler) { throw 'Ahk2Exe.exe missing' }
          foreach ($arch in @('x64', 'x86')) {
            $runtimeName = if ($arch -eq 'x64') { 'AutoHotkey64.exe' } else { 'AutoHotkey32.exe' }
            $runtime = (Get-ChildItem "$tools/runtime" -Filter $runtimeName -Recurse | Select-Object -First 1).FullName
            if (!$runtime) { throw "$runtimeName missing" }
            $output = Join-Path $PWD "dist/btd-battles-1-hotkeys-$arch.exe"
            $arguments = '/in "{0}" /out "{1}" /base "{2}" /compress 0 /silent verbose' -f (Join-Path $PWD 'btd-battles-1-hotkeys.ahk'), $output, $runtime
            $build = Start-Process $compiler -ArgumentList $arguments -Wait -PassThru
            if ($build.ExitCode -ne 0 -or !(Test-Path $output)) { throw "$arch compilation failed" }
            $bytes = [IO.File]::ReadAllBytes($output)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            $expected = if ($arch -eq 'x64') { 0x8664 } else { 0x14c }
            if ($machine -ne $expected) { throw "$arch output has wrong PE architecture: $machine" }
            Write-Host "Verified $arch executable ($($bytes.Length) bytes)"
          }
      - name: Capture release timestamp
        id: release_meta
        shell: pwsh
        run: |
          $timestamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          "release_tag=ahk-build-$timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=AutoHotkey Build $timestamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btd-battles-1-hotkeys
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.release_tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe


